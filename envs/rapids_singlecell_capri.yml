name: rapids_env
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - rapids=26.02
  - python=3.11
  - cuda-version=13.1
  - scanpy=1.10.4
  - scikit-learn=1.5.2
  - numba=0.61.*
  - cudnn
  - leidenalg
  - louvain
  - fa2
  - jupyterlab
  - pip
  - pip:
    - rapids-singlecell==0.13.4
    - anndata
    - decoupler
    - omnipath
    - harmonypy
    - scikit-misc
    - GPUtil
    - setuptools<81